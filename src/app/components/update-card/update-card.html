<div class="container" (click)="handleClick()">
  <div class="header">
    <div class="icon">
      <p class="user-initials">{{ update.creatorName[0] }}</p>
    </div>
    <div class="meta-data">
      <p class="name">{{ update.creatorName }}</p>
      <p class="date">{{ formatTimestamp(update.created_at) }}</p>
    </div>
  </div>
  <div class="divider"></div>
  <div class="body">
    <p class="title">{{ update.title }}</p>
    <img *ngIf="update.image" class="image" src="{{ update.image }}" alt="External Image" />
    <p class="description">
      {{ update.description }}
    </p>
  </div>
  <div class="footer">
    <ng-container *ngIf="type === 'update'">
      <ion-icon
        class="comment-icon"
        (click)="openComments(update)"
        name="chatbubble-outline"
      ></ion-icon>
    </ng-container>
    <ng-container *ngIf="type === 'maintenance'">
      Status:
      <span
        class="status"
        [ngClass]="{
          'status-pending': update.status === 'pending',
          'status-in-progress': update.status === 'progress',
          'status-completed': update.status === 'completed'
        }"
        >{{ update.status }}</span
      >
    </ng-container>
  </div>
</div>
