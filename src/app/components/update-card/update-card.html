<div class="container">
  <div class="header">
    <div class="icon">
      <p class="user-initials">{{ update.creatorName[0] }}</p>
    </div>
    <div class="meta-data">
      <p class="name">{{ update.creatorName }}</p>
      <p class="date">{{ formatTimestamp(update.created_at) }}</p>
    </div>
  </div>
  <div class="divider"></div>
  <div class="body">
    <p class="title">{{ update.title }}</p>
    <!-- <img *ngIf="update.image" class="image" src="{{ update.image }}" alt="External Image" /> -->
    <p class="description">
      {{ update.description }}
    </p>
  </div>
  <div class="footer">
    <ion-icon (click)="openComments(update)" name="chatbubble-outline"></ion-icon>
  </div>
</div>
