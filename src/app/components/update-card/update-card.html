<div class="container" (click)="handleClick()">
  <div class="header">
    <div class="icon">
      <p class="user-initials">{{ update.creatorName[0] }}</p>
    </div>
    <div class="meta-data">
      <p class="name">
        {{ update.creatorName }} <span *ngIf="update.unit"> | Unit {{ update.unit }}</span>
      </p>
      <p class="date">{{ formatTimestamp(update.created_at) }}</p>
    </div>
  </div>
  <div class="divider"></div>
  <div class="body">
    <p class="title">{{ update.title }}</p>
    <img *ngIf="update.image" class="image" src="{{ update.image }}" alt="External Image" />
    <p class="description">
      {{ update.description }}
    </p>
    <p *ngIf="type === 'maintenance' && update.notes" class="description">
      Manager Notes: {{ update.notes }}
    </p>
  </div>
  <div class="footer">
    <ng-container *ngIf="type === 'update'">
      <ion-icon
        class="comment-icon"
        (click)="openComments(update)"
        name="chatbubble-outline"
      ></ion-icon>
    </ng-container>
    <ng-container *ngIf="type === 'maintenance'">
      Status:
      <app-tag
        [bgColor]="
          update.status === 'pending'
            ? '#8ecae6'
            : update.status === 'progress'
            ? '#FFDE21'
            : update.status === 'completed'
            ? '#5cb85c'
            : ''
        "
        title="{{ update.status }}"
      />
    </ng-container>
    <ng-container *ngIf="type === 'maintenance'">
      <app-tag
        class="priority-tag"
        [bgColor]="
          update.priority === 'Low'
            ? '#fff631'
            : update.priority === 'medium'
            ? '#ffa716'
            : update.priority === 'High'
            ? '#ff3707'
            : ''
        "
        title="{{ update.priority }}"
      />
    </ng-container>
    <ng-container *ngIf="type === 'maintenance'">
      <app-tag class="priority-tag" bgColor="pink" title="{{ update.category }}" />
    </ng-container>
    <ng-container *ngIf="type === 'update'">
      <app-tag class="priority-tag" bgColor="pink" title="{{ update.category }}" />
    </ng-container>
  </div>
</div>
